<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Cam Sign Language System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; }
        button { background-color: #89b4fa; color: #11111b; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; margin: 10px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        button:hover { background-color: #b4befe; }
        #status-box { background-color: #313244; display: inline-block; padding: 20px; border-radius: 12px; margin-top: 20px; border: 2px solid #45475a; }
        #result { font-size: 32px; color: #a6e3a1; font-weight: bold; margin-top: 10px; }
        #webcam-container video { border-radius: 8px; border: 3px solid #585b70; transform: scaleX(-1); }
    </style>
</head>
<body>

    <h1>Mobile Cam Sign Language Hub</h1>
    <p>Run translations using your device camera feed directly linked to your Node Board serial connection.</p>
    
    <button onclick="connectHardware()">1. Connect LCD Board (USB)</button>
    <button onclick="startAIEngine()">2. Activate Translator</button>
    
    <br><br>
    
    <div id="status-box">
        <h3>Live Mobile Camera Feed</h3>
        <div id="webcam-container"></div>
        <div id="result">Sign: Awaiting Boot...</div>
    </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURATION: PASTE YOUR TEACHABLE MACHINE LINK HERE!
        // -------------------------------------------------------------
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ODgfY4TC3/"; 

        let model, webcam, maxPredictions, serialPort, writer;
        let lastSentSign = "";

        // Step 1: Open Chrome's built-in Web Serial utility to link data to your board
        async function connectHardware() {
            try {
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(serialPort.writable);
                writer = textEncoder.writable.getWriter();
                
                alert("Success: Node Board paired over serial interface!");
            } catch (err) {
                alert("Serial Connection Error: Close your Arduino Serial Monitor before attempting connection.");
                console.error(err);
            }
        }

        // Step 2: Access local hardware camera device and download AI models
        async function startAIEngine() {
            try {
                document.getElementById("result").innerText = "Loading AI Core...";
                
                // Unpack models directly into system memory
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
                maxPredictions = model.getTotalClasses();
                
                // Initialize web browser webcam settings
                const flip = true; // Mirror the frame layout execution
                webcam = new tmImage.Webcam(400, 300, flip);
                
                // Request mobile device camera asset usage permissions
                await webcam.setup({ facingMode: "environment" }); // "environment" uses rear cam, "user" uses selfie cam
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                document.getElementById("result").innerText = "AI System Active! Starting Loop...";

                // Evaluation loop checking 1 time per second (1000ms) to ensure solid execution
                setInterval(async () => {
                    if (!model || !webcam) return;
                    
                    webcam.update(); // Snap fresh frame layout
                    const prediction = await model.predict(webcam.canvas);
                    
                    let highestProbability = 0;
                    let recognizedSign = "";
                    
                    for (let i = 0; i < maxPredictions; i++) {
                        if (prediction[i].probability > highestProbability) {
                            highestProbability = prediction[i].probability;
                            recognizedSign = prediction[i].className;
                        }
                    }
                    
                    // Filter classifications using an adaptable 55% threshold to eliminate system stall
                    if (highestProbability > 0.55) {
                        document.getElementById("result").innerText = "Sign: " + recognizedSign;
                        
                        // Pass string data down the serial path only on character state changes
                        if (recognizedSign !== lastSentSign) {
                            lastSentSign = recognizedSign;
                            if (writer) {
                                await writer.write(recognizedSign + "\n");
                            }
                        }
                    } else {
                        document.getElementById("result").innerText = "Low Confidence (Saw: " + recognizedSign + ")";
                    }
                }, 1000);
                
            } catch (err) {
                document.getElementById("result").innerText = "Failed to Boot Camera / AI.";
                console.error("AI Initialization Error: ", err);
            }
        }
    </script>
</body>
</html>
