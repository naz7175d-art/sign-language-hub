<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32-CAM Sign Language System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; }
        button { background-color: #89b4fa; color: #11111b; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; margin: 10px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        button:hover { background-color: #b4befe; }
        #status-box { background-color: #313244; display: inline-block; padding: 20px; border-radius: 12px; margin-top: 20px; border: 2px solid #45475a; }
        #result { font-size: 32px; color: #a6e3a1; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>ESP32 Sign Language Hub</h1>
    <p>Follow the steps below to connect your offline browser engine to your hardware layout.</p>
    
    <button onclick="connectHardware()">1. Connect LCD Board (USB)</button>
    <button onclick="startAIEngine()">2. Activate Translator</button>
    
    <br><br>
    
    <div id="status-box">
        <h3>Live Processing Stream Feed</h3>
        <img id="camera-stream" src="http://192.168.0.24:81/stream" width="400" height="300" alt="Waiting for Camera Connection..." style="border-radius: 8px; border: 3px solid #585b70;">
        <div id="result">Sign: Awaiting Boot...</div>
    </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURATION: PASTE YOUR TEACHABLE MACHINE LINK HERE!
        // -------------------------------------------------------------
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/[...]"; 

        let model, maxPredictions, serialPort, writer;
        let lastSentSign = "";

        // Step 1: Open Chrome's built-in Web Serial utility to pass data to your 30-pin board
        async function connectHardware() {
            try {
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(serialPort.writable);
                writer = textEncoder.writable.getWriter();
                
                alert("Success: Node Board paired and locked over serial interface!");
            } catch (err) {
                alert("Serial Connection Error: Make sure your Arduino Serial Monitor is CLOSED before linking.");
                console.error(err);
            }
        }

        // Step 2: Download and unpack your trained neural network models right into memory
        async function startAIEngine() {
            if (MODEL_URL.includes("YOUR_TEACHABLE_MACHINE")) {
                alert("Error: You forgot to replace the placeholder URL on Line 31 with your real Teachable Machine link!");
                return;
            }
            
            document.getElementById("result").innerText = "Loading AI Core...";
            model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            document.getElementById("result").innerText = "AI System Active!";

            const imgElement = document.getElementById("camera-stream");
            
            // Loop evaluation loop checking 3 times per second
            setInterval(async () => {
                if (!model) return;
                
                // Pass the current live image layout frame to the model classifier
                const prediction = await model.predict(imgElement);
                
                let highestProbability = 0;
                let recognizedSign = "";
                
                for (let i = 0; i < maxPredictions; i++) {
                    if (prediction[i].probability > highestProbability) {
                        highestProbability = prediction[i].probability;
                        recognizedSign = prediction[i].className;
                    }
                }
                
                // Only act if the classification exceeds an 85% accuracy confidence score
                if (highestProbability > 0.85) {
                    document.getElementById("result").innerText = "Sign: " + recognizedSign;
                    
                    // Optimization: Only push string over the USB link if the classification has changed
                    if (recognizedSign !== lastSentSign) {
                        lastSentSign = recognizedSign;
                        if (writer) {
                            await writer.write(recognizedSign + "\n");
                        }
                    }
                }
            }, 350);
        }
    </script>
</body>
</html>
